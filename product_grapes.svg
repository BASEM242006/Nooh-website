<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3d20" />
      <stop offset="100%" stop-color="#155d32" />
    </linearGradient>
    <radialGradient id="grapeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#27a85f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0a3d20" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="grapeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ce66b" />
      <stop offset="100%" stop-color="#3b961f" />
    </linearGradient>
    <linearGradient id="grapeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e05275" />
      <stop offset="100%" stop-color="#7a122b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <circle cx="400" cy="300" r="260" fill="url(#grapeGlow)" />

  <!-- Frost / Background Decor -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="200" cy="150" r="30" />
    <circle cx="620" cy="450" r="45" />
    <circle cx="680" cy="180" r="25" />
  </g>

  <!-- Main Content Cluster -->
  <g filter="url(#shadow)" transform="translate(400, 270)">
    <!-- Stem -->
    <path d="M -10 -120 Q 20 -160 50 -180" stroke="#5a3d28" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M 10 -140 Q -30 -160 -60 -150" stroke="#4a8f29" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Leaf -->
    <path d="M 15 -140 Q 70 -160 80 -100 Q 40 -80 15 -140 Z" fill="#2e7d32" stroke="#4caf50" stroke-width="2" />

    <!-- Green Grapes -->
    <circle cx="-50" cy="-60" r="38" fill="url(#grapeGreen)" />
    <circle cx="10" cy="-70" r="42" fill="url(#grapeGreen)" />
    <circle cx="60" cy="-50" r="36" fill="url(#grapeGreen)" />
    
    <!-- Red Grapes Mix -->
    <circle cx="-80" cy="0" r="40" fill="url(#grapeRed)" />
    <circle cx="-20" cy="-10" r="44" fill="url(#grapeGreen)" />
    <circle cx="40" cy="0" r="42" fill="url(#grapeRed)" />
    <circle cx="90" cy="10" r="35" fill="url(#grapeGreen)" />
    
    <circle cx="-50" cy="55" r="38" fill="url(#grapeRed)" />
    <circle cx="10" cy="50" r="45" fill="url(#grapeGreen)" />
    <circle cx="65" cy="65" r="38" fill="url(#grapeRed)" />

    <circle cx="-20" cy="110" r="36" fill="url(#grapeGreen)" />
    <circle cx="30" cy="115" r="38" fill="url(#grapeRed)" />
    <circle cx="5" cy="160" r="32" fill="url(#grapeGreen)" />

    <!-- Frost Shine Highlights -->
    <circle cx="-25" cy="-80" r="6" fill="#ffffff" opacity="0.6" />
    <circle cx="-55" cy="-70" r="5" fill="#ffffff" opacity="0.6" />
    <circle cx="-35" cy="-20" r="7" fill="#ffffff" opacity="0.7" />
    <circle cx="25" cy="-10" r="7" fill="#ffffff" opacity="0.7" />
    <circle cx="-5" cy="40" r="7" fill="#ffffff" opacity="0.7" />
    <circle cx="45" cy="50" r="6" fill="#ffffff" opacity="0.6" />
    <circle cx="-5" cy="100" r="5" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Tag / Title Overlay -->
  <rect x="250" y="490" width="300" height="54" rx="27" fill="rgba(10,30,18,0.85)" stroke="#e8960a" stroke-width="2" />
  <text x="400" y="525" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">IQF Seedless Grapes</text>
</svg>
