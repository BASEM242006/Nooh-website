<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMixV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3b1e" />
      <stop offset="100%" stop-color="#041f0e" />
    </linearGradient>
    <radialGradient id="vegGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#27a85f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#041f0e" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgMixV)" />
  <circle cx="400" cy="290" r="260" fill="url(#vegGlow)" />

  <g filter="url(#shadow)" transform="translate(400, 270)">
    <!-- Broccoli Floret -->
    <path d="M -90 -80 C -140 -60 -120 10 -70 10 C -50 40 -10 30 -10 -10 C 20 10 40 -40 -10 -70 C -30 -110 -70 -110 -90 -80 Z" fill="#2e7d32" stroke="#1b5e20" stroke-width="2" />
    <path d="M -70 -10 L -60 60 L -40 60 L -40 0" fill="#a5d6a7" stroke="#4caf50" stroke-width="2" />

    <!-- Carrot Dices (Bright Orange cubes) -->
    <rect x="20" y="-70" width="48" height="48" rx="8" fill="#ff6d00" stroke="#e65100" stroke-width="2" transform="rotate(12 44 -46)" />
    <rect x="-120" y="20" width="44" height="44" rx="8" fill="#ff6d00" stroke="#dd2c00" stroke-width="2" transform="rotate(-18 -98 42)" />
    <rect x="60" y="30" width="50" height="50" rx="8" fill="#ff6d00" stroke="#e65100" stroke-width="2" transform="rotate(25 85 55)" />

    <!-- Green Peas -->
    <circle cx="20" cy="-110" r="22" fill="#43a047" stroke="#1b5e20" stroke-width="2" />
    <circle cx="-130" cy="-40" r="24" fill="#4caf50" stroke="#2e7d32" stroke-width="2" />
    <circle cx="110" cy="-20" r="23" fill="#388e3c" stroke="#1b5e20" stroke-width="2" />
    <circle cx="-40" cy="80" r="25" fill="#43a047" stroke="#1b5e20" stroke-width="2" />
    <circle cx="15" cy="110" r="22" fill="#4caf50" stroke="#2e7d32" stroke-width="2" />

    <!-- Sweet Corn Kernels -->
    <circle cx="-30" cy="-30" r="16" fill="#ffeb3b" stroke="#f57f17" stroke-width="2" />
    <circle cx="10" cy="20" r="17" fill="#ffc107" stroke="#ff8f00" stroke-width="2" />
    <circle cx="-70" cy="100" r="16" fill="#ffeb3b" stroke="#f57f17" stroke-width="2" />

    <!-- Frost highlights -->
    <circle cx="12" cy="-116" r="4" fill="#fff" opacity="0.8" />
    <circle cx="30" cy="-58" r="4" fill="#fff" opacity="0.8" />
    <circle cx="-50" cy="70" r="4" fill="#fff" opacity="0.8" />
  </g>

  <rect x="230" y="490" width="340" height="54" rx="27" fill="rgba(10,30,18,0.85)" stroke="#27a85f" stroke-width="2" />
  <text x="400" y="525" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">4-Way Gourmet Vegetable Mix</text>
</svg>
