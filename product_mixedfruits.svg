<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMixF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d122d" />
      <stop offset="100%" stop-color="#0a3d20" />
    </linearGradient>
    <radialGradient id="mixGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8960a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0a3d20" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgMixF)" />
  <circle cx="400" cy="290" r="260" fill="url(#mixGlow)" />

  <g filter="url(#shadow)" transform="translate(400, 270)">
    <!-- Strawberry slice -->
    <path d="M -90 -60 C -140 -10 -90 70 -30 30 C 10 70 50 -10 0 -60 Z" fill="#e53935" stroke="#b71c1c" stroke-width="2" />
    <!-- Strawberry seeds -->
    <circle cx="-50" cy="-20" r="2.5" fill="#ffeb3b" />
    <circle cx="-30" cy="0" r="2.5" fill="#ffeb3b" />
    <circle cx="-60" cy="15" r="2.5" fill="#ffeb3b" />

    <!-- Mango Dices (Golden cubes) -->
    <rect x="20" y="-80" width="55" height="55" rx="10" fill="#ffb300" stroke="#ff6f00" stroke-width="2" transform="rotate(15 47 -52)" />
    <rect x="-110" y="30" width="50" height="50" rx="10" fill="#ffa000" stroke="#ff6f00" stroke-width="2" transform="rotate(-20 -85 55)" />
    <rect x="50" y="20" width="60" height="60" rx="12" fill="#ffc107" stroke="#ff8f00" stroke-width="2" transform="rotate(8 80 50)" />

    <!-- Blueberries -->
    <circle cx="0" cy="-110" r="28" fill="#283593" stroke="#1a237e" stroke-width="2" />
    <circle cx="0" cy="-110" r="6" fill="none" stroke="#5c6bc0" stroke-width="2" />
    
    <circle cx="-130" cy="-40" r="24" fill="#303f9f" stroke="#1a237e" stroke-width="2" />
    <circle cx="110" cy="-30" r="26" fill="#283593" stroke="#1a237e" stroke-width="2" />
    
    <circle cx="-20" cy="100" r="30" fill="#1a237e" stroke="#0d47a1" stroke-width="2" />
    <circle cx="-20" cy="100" r="7" fill="none" stroke="#7986cb" stroke-width="2" />

    <circle cx="70" cy="110" r="25" fill="#303f9f" stroke="#1a237e" stroke-width="2" />

    <!-- Frost highlights -->
    <circle cx="-40" cy="-40" r="4" fill="#fff" opacity="0.8" />
    <circle cx="40" cy="-60" r="4" fill="#fff" opacity="0.8" />
    <circle cx="-10" cy="-118" r="4" fill="#fff" opacity="0.8" />
    <circle cx="-28" cy="90" r="4" fill="#fff" opacity="0.8" />
  </g>

  <rect x="230" y="490" width="340" height="54" rx="27" fill="rgba(10,30,18,0.85)" stroke="#e8960a" stroke-width="2" />
  <text x="400" y="525" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Gourmet Frozen Fruit Mix</text>
</svg>
