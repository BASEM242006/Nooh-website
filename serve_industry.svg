<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIndus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051f0e" />
      <stop offset="60%" stop-color="#0c351b" />
      <stop offset="100%" stop-color="#14592e" />
    </linearGradient>
    <radialGradient id="glowIndus" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e8960a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#051f0e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldPlate2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5b830" />
      <stop offset="100%" stop-color="#e8960a" />
    </linearGradient>
    <filter id="dropShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgIndus)" />
  <circle cx="400" cy="220" r="280" fill="url(#glowIndus)" />

  <!-- Subtle Blueprint Tech Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1" fill="none">
    <line x1="80" y1="0" x2="80" y2="500" />
    <line x1="720" y1="0" x2="720" y2="500" />
    <circle cx="400" cy="220" r="180" stroke-dasharray="6,6" />
  </g>

  <!-- Central Industrial Composition -->
  <g filter="url(#dropShadow2)" transform="translate(400, 205)">
    <!-- Base Platform -->
    <ellipse cx="0" cy="45" rx="200" ry="55" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

    <!-- Industrial Drum / Tank Card -->
    <rect x="-110" y="-85" width="220" height="135" rx="20" fill="rgba(8,30,16,0.9)" stroke="url(#goldPlate2)" stroke-width="2.5" />
    
    <!-- Factory Symbol -->
    <text x="0" y="-15" font-size="60" text-anchor="middle">🏭</text>
    
    <!-- Badge inside -->
    <rect x="-85" y="10" width="170" height="28" rx="14" fill="url(#goldPlate2)" />
    <text x="0" y="29" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0a3d20" text-anchor="middle" letter-spacing="1.5">BULK &amp; PROCESSING</text>

    <!-- Side Elements (Barrels / Logistics) -->
    <g transform="translate(-135, -20)">
      <circle cx="0" cy="0" r="32" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
      <text x="0" y="10" font-size="26" text-anchor="middle">🛢️</text>
    </g>
    <g transform="translate(135, -20)">
      <circle cx="0" cy="0" r="32" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
      <text x="0" y="10" font-size="26" text-anchor="middle">📦</text>
    </g>
  </g>

  <!-- Bottom Title Tag -->
  <g transform="translate(400, 420)">
    <rect x="-200" y="-24" width="400" height="48" rx="24" fill="rgba(10,35,18,0.92)" stroke="url(#goldPlate2)" stroke-width="1.5" />
    <text x="0" y="7" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">Food Industry &amp; Manufacturers</text>
  </g>
</svg>
